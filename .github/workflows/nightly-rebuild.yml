# .github/workflows/nightly-rebuild.yml
# Asks AWS Amplify to rebuild the site every weekday evening, so the
# build-time prices pick up the latest closing price.
#
# Setup: add a repository secret named AMPLIFY_WEBHOOK_URL
# (GitHub repo > Settings > Secrets and variables > Actions > New repository secret).

name: Nightly rebuild (refresh stock prices)

on:
  schedule:
    # GitHub cron is in UTC. 02:00 UTC Tue–Sat = 8:00 PM Central (standard time,
    # 9:00 PM during daylight time), Mon–Fri evenings, after the US market close.
    - cron: "0 2 * * 2-6"
  workflow_dispatch: {} # adds a "Run workflow" button for manual rebuilds

jobs:
  trigger-amplify:
    runs-on: ubuntu-latest
    steps:
      - name: Call Amplify incoming webhook
        env:
          WEBHOOK: ${{ secrets.AMPLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "AMPLIFY_WEBHOOK_URL secret is missing"; exit 1; fi
          curl --fail --silent --show-error -X POST -d '{}' \
            -H "Content-Type: application/json" "$WEBHOOK"
